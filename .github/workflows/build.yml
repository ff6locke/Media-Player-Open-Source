name: Build Android App

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    name: Diagnostic Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Diagnostic - List Workspace Files
        run: |
          echo "=== 1. Listing all folders and files in the repository (up to depth 3) ==="
          find . -maxdepth 3 -not -path '*/.*'
          
          echo "=== 2. Searching for any file containing 'gradle' or configuration scripts ==="
          find . -name "*gradle*" -o -name "*.xml" -o -name "*.properties"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Stub
        run: |
          echo "Review the file list above from the GitHub Actions log to see where your project files reside."
