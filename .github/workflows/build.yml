name: Build Android App

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Safe Auto-Detect Project Directory and Build
        run: |
          echo "Searching for Gradle build files in the repository..."
          
          # Safely find settings file first
          SETTINGS_FILE=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
          
          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          else
            # Fallback to build file if settings file isn't found
            BUILD_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR=$(dirname "$BUILD_FILE")
            else
              PROJECT_DIR="."
            fi
          fi
          
          echo "Successfully determined project directory: ./$PROJECT_DIR"
          
          # Move into the project directory safely
          cd "$PROJECT_DIR"
          
          # Locate and execute Gradle build wrapper
          if [ -f "gradlew" ]; then
            echo "Found local gradlew wrapper. Executing build..."
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          elif [ -f "../gradlew" ]; then
            echo "Found gradlew wrapper in parent directory..."
            cd ..
            chmod +x gradlew
            ./gradlew :app:assembleDebug --no-daemon
          else
            echo "gradlew wrapper not found. Attempting system gradle..."
            gradle assembleDebug --no-daemon
          fi
