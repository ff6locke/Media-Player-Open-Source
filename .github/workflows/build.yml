name: Build Android App

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Check Files and Build
        run: |
          echo "=== Files present in repository root ==="
          ls -la
          
          if [ -f "gradlew" ]; then
            echo "Found gradlew wrapper!"
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
            
          elif [ -f "build.gradle" ] || [ -f "build.gradle.kts" ] || [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "Gradle files found, but gradlew is missing. Generating wrapper..."
            gradle wrapper
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
            
          else
            echo "=========================================================="
            echo "ERROR: No Android project files found in this repository!"
            echo "Your local project code has not been pushed to GitHub yet."
            echo "=========================================================="
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
