name: Build Android App

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Auto-Detect Project Directory and Build
        run: |
          echo "Searching for Gradle build files in the repository..."
          
          # Find the directory containing settings.gradle or build.gradle
          PROJECT_DIR=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" | head -n 1 | xargs dirname)
          
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            if [ -f "settings.gradle" ] || [ -f "build.gradle" ]; then
              PROJECT_DIR="."
            else
              echo "Error: Could not find any Gradle project files (settings.gradle/build.gradle) in the repository."
              exit 1
            fi
          fi
          
          echo "Successfully found project directory at: ./$PROJECT_DIR"
          
          # Move into the project directory
          cd "$PROJECT_DIR"
          
          # Check for gradlew and build
          if [ -f "gradlew" ]; then
            echo "Found gradlew wrapper. Executing build..."
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            echo "gradlew wrapper not found in this folder. Running global gradle..."
            gradle assembleDebug --no-daemon
          fi
