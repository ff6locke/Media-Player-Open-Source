name: Build Android App from Zip

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    name: Unzip and Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip Project Archive
        run: |
          echo "Extracting TVBoxGoogleTV.zip..."
          mkdir -p project_source
          unzip -q TVBoxGoogleTV.zip -d project_source
          echo "=== Extracted Contents ==="
          ls -la project_source

      - name: Locate Project and Build with Gradle
        run: |
          cd project_source
          
          # Automatically find the directory containing Gradle build/settings files
          SETTINGS_FILE=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
          
          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          else
            BUILD_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR=$(dirname "$BUILD_FILE")
            else
              PROJECT_DIR="."
            fi
          fi
          
          echo "Found project folder at: ./$PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # Check for gradlew or generate it
          if [ -f "gradlew" ]; then
            echo "Found gradlew wrapper. Executing build..."
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            echo "gradlew not found. Generating gradle wrapper..."
            gradle wrapper
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            project_source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
